name: Supabase health check

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-health-check
  cancel-in-progress: true

jobs:
  check-database:
    name: Check public wishlist data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets['SUPABASE_PUBLISHABLE_KEY'] }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is not configured."
            exit 1
          fi

          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY is not configured."
            exit 1
          fi

      - name: Query featured wishlists
        env:
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets['SUPABASE_PUBLISHABLE_KEY'] }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 45 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
              --header "Accept: application/json" \
              "$SUPABASE_URL/rest/v1/featured_wishlists?select=slug&limit=1"
          )"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "::error::Supabase health check returned HTTP $status_code."
            exit 1
          fi

          if ! grep -Eq '^\[.*\]$' "$response_file"; then
            echo "::error::Supabase returned an unexpected response."
            exit 1
          fi

          echo "Supabase responded successfully with HTTP $status_code."